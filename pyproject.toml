[project]
name = "statecensor-bench"
version = "0.1.0"
description = "StateCensor-Bench: an Inspect AI eval measuring CCP-aligned political censorship in LLM responses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "inspect_ai>=0.3.259,<0.4",
    "huggingface_hub>=1,<2",
]

[project.entry-points.inspect_ai]
statecensor_bench = "statecensor_bench"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statecensor_bench"]

[tool.pytest.ini_options]
markers = ["slow: hits the Hugging Face Hub over the network"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
